name: Atualizar notícias

on:
  schedule:
    # a cada 30 minutos (o GitHub pode atrasar execuções agendadas em alguns minutos)
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

# Sem actions externas: o repositório exige actions fixadas por SHA,
# então o checkout é feito com git puro e o Python é o que já vem no runner.
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Baixar o repositório
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git init -q .
          git remote add origin "https://github.com/$REPO.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git fetch -q --depth 1 origin "$BRANCH"
          git checkout -q -B "$BRANCH" FETCH_HEAD

      - name: Coletar notícias
        run: python3 scripts/fetch_news.py

      - name: Commit do news.json
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -q -m "chore: notícias de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push -q origin "HEAD:$BRANCH"
