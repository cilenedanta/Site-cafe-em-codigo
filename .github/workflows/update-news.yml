name: Atualizar notícias

on:
  schedule:
    # 06:47 no horário de Brasília (09:47 UTC), todos os dias
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar notícias
        run: python scripts/fetch_news.py

      - name: Commit do news.json
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: notícias de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
