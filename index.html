<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café em Código · Notícias do Dia</title>
  <meta name="description" content="Dashboard diário com notícias de tecnologia, carreira tech, inteligência artificial e dados.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top__inner">
      <div class="brand">
        <span class="brand__cup" aria-hidden="true">☕</span>
        <div>
          <p class="brand__kicker">Café em Código</p>
          <h1 class="brand__title">Notícias do Dia</h1>
        </div>
      </div>
      <div class="meta">
        <p id="today" class="meta__date"></p>
        <p id="updated" class="meta__updated">Carregando…</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis" aria-label="Resumo do dia"></section>

    <section class="toolbar" aria-label="Filtros">
      <div class="chips" id="chips" role="tablist"></div>
      <div class="toolbar__right">
        <label class="search">
          <span class="sr-only">Buscar notícias</span>
          <input id="search" type="search" placeholder="Buscar no dia… (ex.: Python, LGPD)" autocomplete="off">
        </label>
        <select id="window" aria-label="Período">
          <option value="30">Últimos 30 min</option>
          <option value="120">Últimas 2h</option>
          <option value="360">Últimas 6h</option>
          <option value="1440">Últimas 24h</option>
          <option value="2880">Últimas 48h</option>
        </select>
        <select id="lang" aria-label="Idioma">
          <option value="all">Todos os idiomas</option>
          <option value="pt">Português</option>
          <option value="en">Inglês</option>
        </select>
      </div>
    </section>

    <section id="board" class="board" aria-live="polite"></section>

    <section class="sources" aria-labelledby="sources-title">
      <div class="sources__head">
        <h2 id="sources-title">Fontes monitoradas</h2>
        <p>Todas as notícias vêm de feeds públicos (RSS/Atom). Cada link leva à matéria original.</p>
      </div>
      <div id="sources" class="sources__grid"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p>Coleta automática a cada 30 minutos por GitHub Actions · <a href="data/news.json">dados em JSON</a></p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
